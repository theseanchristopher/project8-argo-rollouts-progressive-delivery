apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: project8-nginx-rollout
  namespace: project8-dev
spec:
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause:
            duration: 60
        - analysis:
            templates:
              - templateName: project9-restart-rollback-freeze
                clusterScope: true
        - setWeight: 50
        - pause:
            duration: 120

