<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; font-size: 14px; }
    .box { fill: #f2f2f2; stroke: #111; stroke-width: 1; rx: 16; ry: 16; }
    .arrow { stroke: #111; stroke-width: 2; marker-end: url(#arrowhead); }
    .title { font-size: 18px; font-weight: bold; }
    .label { font-size: 13px; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#111"/>
    </marker>
  </defs>

  <text x="30" y="35" class="title">Project 8 — Canary Rollout with Prometheus Analysis (GitOps)</text>

  <rect x="40" y="80" width="220" height="80" class="box"/>
  <text x="70" y="112">CI (Project 1)</text>
  <text x="70" y="134" class="label">Build + publish image</text>

  <rect x="300" y="80" width="260" height="80" class="box"/>
  <text x="330" y="112">GitOps Repo (Project 8)</text>
  <text x="330" y="134" class="label">Rollout + AnalysisTemplate + Kustomize</text>

  <rect x="600" y="80" width="200" height="80" class="box"/>
  <text x="660" y="112">Argo CD</text>
  <text x="625" y="134" class="label">Sync desired state</text>

  <rect x="840" y="80" width="320" height="80" class="box"/>
  <text x="910" y="112">Argo Rollouts</text>
  <text x="870" y="134" class="label">Canary steps + AnalysisRun gate</text>

  <rect x="600" y="230" width="280" height="90" class="box"/>
  <text x="700" y="265">Prometheus</text>
  <text x="635" y="287" class="label">PromQL query via HTTP API</text>

  <line x1="260" y1="120" x2="300" y2="120" class="arrow"/>
  <line x1="560" y1="120" x2="600" y2="120" class="arrow"/>
  <line x1="800" y1="120" x2="840" y2="120" class="arrow"/>

  <line x1="1000" y1="160" x2="740" y2="230" class="arrow"/>
  <text x="820" y="195" class="label">AnalysisRun executes query</text>

  <line x1="740" y1="230" x2="1000" y2="160" class="arrow"/>
  <text x="830" y="250" class="label">Result returned</text>

  <text x="40" y="350" class="label">Outcome: Pass → Continue/Promote | Fail → Abort + Rollback</text>
</svg>
